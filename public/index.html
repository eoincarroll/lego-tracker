<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO Set & Part Inventory Tracker</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #e50914;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --success-color: #2e7d32;
            --input-bg: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
            gap: 15px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            flex-grow: 1;
            max-width: 500px;
        }

        input[type="text"], select {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent-color);
        }

        .search-container input {
            flex-grow: 1;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #b20710;
        }

        button.secondary {
            background-color: #333333;
        }

        button.secondary:hover {
            background-color: #444444;
        }

        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            gap: 15px;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .set-header {
            display: flex;
            gap: 20px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            align-items: center;
        }

        .set-header img {
            max-width: 150px;
            max-height: 150px;
            object-fit: contain;
            border-radius: 6px;
            background-color: white;
            padding: 5px;
        }

        .set-info h2 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .set-info p {
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .progress-bar-container {
            width: 100%;
            height: 12px;
            background-color: var(--input-bg);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--success-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .parts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .part-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .part-card.complete {
            border-color: var(--success-color);
            opacity: 0.7;
        }

        .part-img {
            height: 100px;
            width: 100%;
            object-fit: contain;
            margin-bottom: 10px;
            background-color: #2a2a2a;
            border-radius: 4px;
            padding: 5px;
        }

        .part-name {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        .part-details {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--input-bg);
            border-radius: 6px;
            padding: 5px;
        }

        .qty-btn {
            background-color: var(--border-color);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-size: 1.2rem;
        }

        .qty-btn:hover {
            background-color: #444;
        }

        .qty-display {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .status-badge.complete {
            background-color: var(--success-color);
            color: white;
        }

        .status-badge.missing {
            background-color: #d32f2f;
            color: white;
        }

        #loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: var(--text-muted);
            display: none;
        }

        .sync-status {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-left: auto;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            border: 1px solid var(--border-color);
        }

        .modal-content h3 {
            margin-bottom: 15px;
        }

        .modal-content p {
            margin-bottom: 15px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .file-input-wrapper {
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🧱 LEGO Tracker</h1>
        <div class="search-container">
            <input type="text" id="set-input" placeholder="Enter Set # (e.g. 75212 or 75243)">
            <button onclick="loadSet()">Fetch Set</button>
        </div>
    </header>

    <div class="controls-bar">
        <div class="filter-group">
            <select id="saved-sets-select" onchange="switchSavedSet()">
                <option value="">-- Load Saved Set --</option>
            </select>
            <select id="filter-status" onchange="renderParts()">
                <option value="all">Show All Parts</option>
                <option value="missing">Missing Parts Only</option>
                <option value="complete">Completed Parts Only</option>
            </select>
            <select id="filter-color" onchange="renderParts()">
                <option value="all">All Colors</option>
            </select>
        </div>

        <div class="filter-group">
            <button class="secondary" onclick="exportBackup()">Export JSON</button>
            <button class="secondary" onclick="openImportModal()">Import JSON</button>
            <span id="sync-indicator" class="sync-status">Cloud Status: Ready</span>
        </div>
    </div>

    <div id="loading">Fetching set details and parts inventory...</div>

    <div id="set-view" style="display: none;">
        <div class="set-header">
            <img id="set-img" src="" alt="Set Preview">
            <div class="set-info" style="flex-grow: 1;">
                <h2 id="set-title">Set Title</h2>
                <p id="set-meta">Set Number • Year • Total Parts</p>
                <p id="progress-text">Progress: 0 / 0 Parts Collected (0%)</p>
                <div class="progress-bar-container">
                    <div id="progress-fill" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>

        <div id="parts-container" class="parts-grid"></div>
    </div>

    <!-- Import Modal -->
    <div id="import-modal" class="modal">
        <div class="modal-content">
            <h3>Import JSON Backup</h3>
            <p>Select a local backup JSON file to upload directly to your Cloud Firestore database.</p>
            <div class="file-input-wrapper">
                <input type="file" id="backup-file-input" accept=".json">
            </div>
            <div class="modal-actions">
                <button class="secondary" onclick="closeImportModal()">Cancel</button>
                <button onclick="uploadBackupFile()">Upload & Sync</button>
            </div>
        </div>
    </div>

    <script>
        const USER_ID = 'default_user';
        let currentSetData = null;
        let allSavedSets = {};

        // Page Load Initializer
        window.addEventListener('DOMContentLoaded', async () => {
            await fetchUserProgress();
        });

        // 1. Fetch user saved inventory list from cloud backend
        async function fetchUserProgress() {
            updateSyncStatus('Syncing with Cloud...');
            try {
                const res = await fetch(`/api/progress/${USER_ID}`);
                if (res.ok) {
                    const data = await res.json();
                    allSavedSets = data.savedSets || {};
                    populateSavedSetsDropdown();
                    updateSyncStatus('Cloud In Sync');
                } else {
                    updateSyncStatus('Offline / Local Mode');
                }
            } catch (err) {
                console.error('Error loading progress:', err);
                updateSyncStatus('Error connecting to backend');
            }
        }

        function updateSyncStatus(msg) {
            document.getElementById('sync-indicator').innerText = `Cloud Status: ${msg}`;
        }

        function populateSavedSetsDropdown() {
            const dropdown = document.getElementById('saved-sets-select');
            dropdown.innerHTML = '<option value="">-- Load Saved Set --</option>';
            
            Object.keys(allSavedSets).forEach(setNum => {
                const setObj = allSavedSets[setNum];
                const opt = document.createElement('option');
                opt.value = setNum;
                opt.innerText = `${setObj.name || setNum} (${setObj.setNum})`;
                dropdown.appendChild(opt);
            });
        }

        // 2. Fetch new set from Rebrickable API via Express backend
        async function loadSet() {
            const input = document.getElementById('set-input').value.trim();
            if (!input) return alert('Please enter a valid LEGO set number.');

            document.getElementById('loading').style.display = 'block';
            document.getElementById('set-view').style.display = 'none';

            try {
                const res = await fetch(`/api/set/${encodeURIComponent(input)}`);
                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Failed to fetch set details.');
                }

                // If user already had progress saved for this set, merge the qtyHave count
                if (allSavedSets[data.setNum]) {
                    const savedPartsMap = {};
                    (allSavedSets[data.setNum].parts || []).forEach(p => {
                        const key = `${p.partNum}_${p.colorId}`;
                        savedPartsMap[key] = p.qtyHave || 0;
                    });

                    data.parts.forEach(p => {
                        const key = `${p.partNum}_${p.colorId}`;
                        if (savedPartsMap[key] !== undefined) {
                            p.qtyHave = savedPartsMap[key];
                        }
                    });
                }

                currentSetData = data;
                setupColorFilter();
                renderSetHeader();
                renderParts();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('set-view').style.display = 'block';
                
                saveCurrentSetProgress(); // Save state locally and cloud

            } catch (err) {
                alert(err.message);
                document.getElementById('loading').style.display = 'none';
            }
        }

        function switchSavedSet() {
            const setNum = document.getElementById('saved-sets-select').value;
            if (!setNum || !allSavedSets[setNum]) return;

            currentSetData = allSavedSets[setNum];
            setupColorFilter();
            renderSetHeader();
            renderParts();
            document.getElementById('set-view').style.display = 'block';
        }

        function setupColorFilter() {
            const colorSelect = document.getElementById('filter-color');
            colorSelect.innerHTML = '<option value="all">All Colors</option>';

            const colors = new Set();
            currentSetData.parts.forEach(p => colors.add(p.color));

            Array.from(colors).sort().forEach(color => {
                const opt = document.createElement('option');
                opt.value = color;
                opt.innerText = color;
                colorSelect.appendChild(opt);
            });
        }

        function renderSetHeader() {
            document.getElementById('set-img').src = currentSetData.setImageUrl || '';
            document.getElementById('set-title').innerText = currentSetData.name;
            document.getElementById('set-meta').innerText = `Set ${currentSetData.setNum} • ${currentSetData.year} • ${currentSetData.totalParts} Total Parts`;
            updateProgressBar();
        }

        function updateProgressBar() {
            let totalReq = 0;
            let totalHave = 0;

            currentSetData.parts.forEach(p => {
                totalReq += p.qtyRequired;
                totalHave += Math.min(p.qtyHave, p.qtyRequired);
            });

            const percent = totalReq > 0 ? Math.round((totalHave / totalReq) * 100) : 0;
            document.getElementById('progress-text').innerText = `Progress: ${totalHave} / ${totalReq} Parts Collected (${percent}%)`;
            document.getElementById('progress-fill').style.width = `${percent}%`;
        }

        // 3. Render filtered Grid of Parts
        function renderParts() {
            const container = document.getElementById('parts-container');
            container.innerHTML = '';

            const statusFilter = document.getElementById('filter-status').value;
            const colorFilter = document.getElementById('filter-color').value;

            currentSetData.parts.forEach((part, index) => {
                const isComplete = part.qtyHave >= part.qtyRequired;

                if (statusFilter === 'missing' && isComplete) return;
                if (statusFilter === 'complete' && !isComplete) return;
                if (colorFilter !== 'all' && part.color !== colorFilter) return;

                const card = document.createElement('div');
                card.className = `part-card ${isComplete ? 'complete' : ''}`;

                card.innerHTML = `
                    <span class="status-badge ${isComplete ? 'complete' : 'missing'}">
                        ${isComplete ? 'COMPLETE' : `${part.qtyRequired - part.qtyHave} NEEDED`}
                    </span>
                    <img class="part-img" src="${part.imageUrl || 'https://via.placeholder.com/100?text=No+Image'}" alt="${part.name}">
                    <div class="part-name">${part.name}</div>
                    <div class="part-details">
                        Color: <strong>${part.color}</strong><br>
                        Part #: ${part.partNum} ${part.elementId ? `| EID: ${part.elementId}` : ''}
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="adjustQty(${index}, -1)">-</button>
                        <span class="qty-display">${part.qtyHave} / ${part.qtyRequired}</span>
                        <button class="qty-btn" onclick="adjustQty(${index}, 1)">+</button>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function adjustQty(index, change) {
            const part = currentSetData.parts[index];
            const newQty = part.qtyHave + change;
            if (newQty < 0) return;

            part.qtyHave = newQty;
            renderSetHeader();
            renderParts();
            saveCurrentSetProgress();
        }

        // 4. Persistence & Syncing
        let debounceTimer;
        function saveCurrentSetProgress() {
            if (!currentSetData) return;

            // Cache in local memory
            allSavedSets[currentSetData.setNum] = currentSetData;
            populateSavedSetsDropdown();

            // Debounced Cloud Post to avoid high request rates
            clearTimeout(debounceTimer);
            updateSyncStatus('Saving changes...');
            
            debounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch('/api/progress/save-set', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            userId: USER_ID,
                            setNum: currentSetData.setNum,
                            setProgress: currentSetData
                        })
                    });

                    if (res.ok) {
                        updateSyncStatus('Cloud In Sync');
                    } else {
                        updateSyncStatus('Save Failed');
                    }
                } catch (e) {
                    updateSyncStatus('Offline Mode (Unsaved)');
                }
            }, 1000);
        }

        // 5. Backup Export & Import Modal Handlers
        function exportBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allSavedSets, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `lego_tracker_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function openImportModal() {
            document.getElementById('import-modal').style.display = 'flex';
        }

        function closeImportModal() {
            document.getElementById('import-modal').style.display = 'none';
        }

        async function uploadBackupFile() {
            const fileInput = document.getElementById('backup-file-input');
            if (!fileInput.files.length) return alert('Select a JSON file first.');

            const formData = new FormData();
            formData.append('backupFile', fileInput.files[0]);
            formData.append('userId', USER_ID);

            updateSyncStatus('Uploading Backup...');
            try {
                const res = await fetch('/api/progress/upload-json', {
                    method: 'POST',
                    body: formData
                });
                const result = await res.json();

                if (res.ok) {
                    alert(result.message);
                    closeImportModal();
                    await fetchUserProgress();
                } else {
                    alert(`Upload Error: ${result.error}`);
                }
            } catch (err) {
                alert(`Upload Failed: ${err.message}`);
            } finally {
                updateSyncStatus('Cloud In Sync');
            }
        }
    </script>
</body>
</html>
